[package]
name = "liteparse-c"
version = "2.13.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C bindings for LiteParse"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["tesseract"]
tesseract = ["liteparse/tesseract"]

[dependencies]
liteparse = { package = "liteparse", version = "2.13.0", path = "../liteparse", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
