[package]
name = "liteparse-c"
version = "2.14.7"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C bindings for LiteParse"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["tesseract"]
tesseract = ["liteparse/tesseract"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
liteparse = { package = "liteparse", version = "2.14.7", path = "../liteparse", default-features = false }
liteparse-pdfium = { version = "1.11.0", path = "../pdfium" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }


